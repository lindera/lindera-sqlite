name: Regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  format:
    name: Format
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
        toolchain: [stable]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.platform.target }}
          components: rustfmt, clippy

      - name: Check format
        run: cargo fmt --all -- --check

      # `e2e` is a package of its own, which `cargo fmt --all` does not cover.
      - name: Check format of the end-to-end test
        run: cargo fmt --manifest-path e2e/Cargo.toml -- --check

  test:
    name: Test
    needs: [format]
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            skip_test_run: true
        toolchain: [stable]
    runs-on: ${{ matrix.platform.runner }}
    env:
      LINDERA_CONFIG_FILE: "./resources/lindera.yml"
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.platform.target }}
          components: rustfmt, clippy

      - name: Run test
        run: cargo test --target "${{ matrix.platform.target }}" --features=embed-cjk ${{ matrix.platform.skip_test_run == true && '--no-run' || '' }}

      - name: Build extension
        if: matrix.platform.skip_test_run != true
        run: cargo build --target "${{ matrix.platform.target }}" --features=embed-cjk

      # The test runs in the directory of its package, so both paths are absolute.
      - name: Load extension into SQLite
        if: matrix.platform.skip_test_run != true
        env:
          LINDERA_CONFIG_FILE: "${{ github.workspace }}/resources/lindera.yml"
          LINDERA_SQLITE_LIB_DIR: "${{ github.workspace }}/target/${{ matrix.platform.target }}/debug"
        run: cargo test --manifest-path e2e/Cargo.toml
