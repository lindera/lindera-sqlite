# Dependabot configuration for version updates.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  # Rust crate and its end-to-end test (Cargo.lock is not committed).
  # Minor and patch updates are grouped into a single PR to reduce noise;
  # major updates still get individual PRs for careful review.
  - package-ecosystem: cargo
    directories:
      - /
      - /e2e
    schedule:
      interval: daily
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # GitHub Actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
